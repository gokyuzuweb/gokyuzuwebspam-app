# MailShield Pro — main configuration
# /etc/mailshield/mailshield.conf

[main]
api_bind        = 127.0.0.1:8001
milter_bind     = 127.0.0.1:33333
log_dir         = /var/log/mailshield
quarantine_dir  = /var/spool/mailshield/quarantine
mongo_url       = mongodb://127.0.0.1:27017
mongo_db        = mailshield

[engines]
spamassassin    = on
clamav          = on
dcc             = on
razor           = on
rspamd          = off
ai              = off

[ai]
provider           = emergent
model              = claude-sonnet-4.5
emergent_llm_key   = 

[reseller]
allow_manage_lists    = yes
allow_manage_rules    = no
allow_release_messages = yes
